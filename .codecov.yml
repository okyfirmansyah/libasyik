codecov:
  require_ci_to_pass: yes

# library code only; tests/ and external/ would inflate the number
ignore:
  - "tests/**"
  - "external/**"
  - "benchmarks/**"

coverage:
  precision: 2
  round: down
  range: "70...100"
  status:
    project:
      default:
        target: 95%
        threshold: 1%
    patch: off
